<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #0f1116;
    }
    #st-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
    /* Carga la fuente que usa el canvas (años y rótulos del mapa) */
    #st-fontload {
      position: absolute;
      left: 0;
      top: 0;
      font-family: "Archivo Black", sans-serif;
      font-size: 20px;
      color: rgba(0, 0, 0, 0.01);
      pointer-events: none;
    }
  </style>

  <div id="root" data-composition-id="story" data-width="1080" data-height="1920">
    <canvas id="st-canvas" width="1080" height="1920"></canvas>
    <div id="st-fontload" data-layout-ignore>1940 VARSOVIA POLONIA</div>
  </div>

  <script>
    (function () {
      const W = 1080, H = 1920;
      const END = 20;
      const cv = document.getElementById("st-canvas");
      const ctx = cv.getContext("2d");

      // ---------- Paleta ----------
      const INK = "#efe6d6";
      const GOLD = "#e3a83e";
      const RED = "#c4473a";
      const CROWD = "#b3bccb";
      const FONT = '"Archivo Black", sans-serif';

      // ---------- Utilidades ----------
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const eOut = (k) => 1 - Math.pow(1 - k, 3);
      const eIn = (k) => k * k * k;
      const eIO = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      const eBack = (k) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
      const bump = (t, t0, d) => { const u = (t - t0) / d; return u < 0 || u > 1 ? 0 : Math.sin(Math.PI * u); };
      const fract = (x) => x - Math.floor(x);
      const hash = (n) => fract(Math.sin(n * 127.1 + 311.7) * 43758.5453);
      function hexRGB(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
      function mix(a, b, k) { const A = hexRGB(a), B = hexRGB(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",") + ")"; }
      function rgba(c, a) { const A = hexRGB(c); return "rgba(" + A[0] + "," + A[1] + "," + A[2] + "," + a + ")"; }

      let T = 0;      // tiempo actual (s)
      let F12 = 0;    // fotograma de "línea viva" (12 por segundo)
      // Temblor de trazo dibujado a mano: cambia 12 veces por segundo, siempre igual en cada render
      const J = (k, amp) => (hash(k * 13.37 + F12 * 7.91) - 0.5) * 2 * amp;

      // ---------- Cámara, sacudidas y destellos ----------
      const SHAKES = [[11.0, 12], [17.6, 18], [18.4, 14]];
      function shakeAt(t) {
        let x = 0, y = 0;
        SHAKES.forEach(([t0, amp], i) => {
          const dt = t - t0, D = 0.45;
          if (dt < 0 || dt > D) return;
          const env = Math.exp(-7 * dt) * Math.pow(1 - dt / D, 2) * amp;
          x += env * Math.sin(6.2832 * (12 + i) * dt + i);
          y += env * Math.sin(6.2832 * (10 + i) * dt + i * 2.1);
        });
        return { x, y, r: x * 0.0012 };
      }
      const FLASHES = [[11.0, 0.2, "#ffffff"], [17.6, 0.35, "#ff5a4a"], [18.4, 0.2, "#ffe6d6"]];
      const CUTS = [0, 2.1, 7.0, 11.0, 17.5];
      function cam(z, cx, cy) {
        const sh = shakeAt(T);
        let cut = 0;
        CUTS.forEach((c) => { if (T >= c) cut = c; });
        const punch = 1 + 0.04 * (1 - eOut(seg(T, cut, cut + 0.45)));
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.translate(W / 2 + sh.x, H / 2 + sh.y);
        ctx.rotate(sh.r);
        ctx.scale(z * punch, z * punch);
        ctx.translate(-cx, -cy);
      }

      // ---------- Dibujo básico ----------
      function line(pts, col, lw) {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.stroke();
      }
      function circle(x, y, r, fill, stroke, lw) {
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 4; ctx.stroke(); }
      }
      function rrect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }
      function vgrad(y0, y1, stops) {
        const g = ctx.createLinearGradient(0, y0, 0, y1);
        stops.forEach(([o, c]) => g.addColorStop(o, c));
        return g;
      }
      function sky(top, bottom, y1) {
        ctx.fillStyle = vgrad(-400, y1, [[0, top], [1, bottom]]);
        ctx.fillRect(-500, -500, W + 1000, y1 + 500);
      }
      function ground(y, col, lineCol) {
        ctx.fillStyle = col;
        ctx.fillRect(-500, y, W + 1000, H - y + 600);
        if (lineCol) line([[-500, y], [W + 500, y]], lineCol, 4);
      }

      // ---------- Personaje stickman (rig por parámetros) ----------
      // Ángulos en radianes desde la vertical hacia abajo; positivo = hacia delante del personaje.
      const POSE = {
        idle: { aB: [-0.14, 0.18], aF: [0.14, 0.18], lB: [-0.1, 0], lF: [0.1, 0], lean: 0, tilt: 0 },
      };
      function blendPose(a, b, k) {
        const o = {};
        ["aB", "aF", "lB", "lF"].forEach((key) => { o[key] = [lerp(a[key][0], b[key][0], k), lerp(a[key][1], b[key][1], k)]; });
        o.lean = lerp(a.lean || 0, b.lean || 0, k);
        o.tilt = lerp(a.tilt || 0, b.tilt || 0, k);
        return o;
      }
      function idlePose(id) {
        const br = Math.sin((T + id) * 2.6) * 0.035;
        return { aB: [-0.14 - br, 0.18], aF: [0.14 + br, 0.18], lB: [-0.1, 0], lF: [0.1, 0], lean: 0, tilt: Math.sin((T + id * 0.7) * 1.3) * 0.03 };
      }
      function walkPose(t, hz, id, amt) {
        const p = 6.2832 * hz * t + id;
        const a = amt == null ? 1 : amt;
        return {
          lF: [0.42 * Math.sin(p) * a, -0.85 * Math.max(0, Math.cos(p)) * a],
          lB: [0.42 * Math.sin(p + Math.PI) * a, -0.85 * Math.max(0, Math.cos(p + Math.PI)) * a],
          aF: [-0.42 * Math.sin(p) * a + 0.1, 0.35],
          aB: [0.42 * Math.sin(p) * a - 0.1, 0.35],
          lean: 0.06 * a,
          tilt: 0,
        };
      }

      function stick(o) {
        const s = o.s || 1, d = o.dir || 1, id = o.id || 1, col = o.col || INK, lw = o.lw || 7;
        const TH = 46, SH = 46, UA = 36, FA = 34, TORSO = 74, HR = 25;
        const p = o.pose || idlePose(id);
        const fy = (l) => Math.cos(l[0]) * TH + Math.cos(l[0] + l[1]) * SH;
        const hipH = Math.max(fy(p.lB), fy(p.lF));
        const sq = o.sq || 1;
        const jit = o.jit == null ? 1.2 : o.jit;
        const jt = (k) => J(id * 31 + k, jit);
        ctx.save();
        ctx.translate(o.x, o.y);
        if (o.rot) ctx.rotate(o.rot);
        ctx.scale(s * d * (1 + (1 - sq) * 0.6), s * sq);
        if (o.alpha != null) ctx.globalAlpha = o.alpha;
        ctx.lineCap = "round"; ctx.lineJoin = "round";

        const hip = [jt(1), -hipH + (o.bob || 0) + jt(2)];
        const lean = p.lean || 0;
        const neck = [hip[0] + Math.sin(lean) * TORSO + jt(3), hip[1] - Math.cos(lean) * TORSO + jt(4)];
        const sh = [lerp(hip[0], neck[0], 0.88), lerp(hip[1], neck[1], 0.88)];
        const ht = lean + (p.tilt || 0) + (o.tilt || 0);
        const head = [neck[0] + Math.sin(ht) * (HR + 5), neck[1] - Math.cos(ht) * (HR + 5)];
        const limb = (base, a, L1, L2, k) => {
          const j = [base[0] + Math.sin(a[0]) * L1 + jt(k), base[1] + Math.cos(a[0]) * L1 + jt(k + 1)];
          const e = [j[0] + Math.sin(a[0] + a[1]) * L2 + jt(k + 2), j[1] + Math.cos(a[0] + a[1]) * L2 + jt(k + 3)];
          return [base, j, e];
        };
        const legB = limb(hip, p.lB, TH, SH, 10);
        const legF = limb(hip, p.lF, TH, SH, 20);
        const armB = limb(sh, p.aB, UA, FA, 30);
        const armF = limb(sh, p.aF, UA, FA, 40);

        line(legB, col, lw);
        line(armB, col, lw);
        line(legF, col, lw);
        if (o.dress) {
          const w = [lerp(hip[0], neck[0], 0.34), lerp(hip[1], neck[1], 0.34)];
          ctx.beginPath();
          ctx.moveTo(w[0] - 12, w[1]);
          ctx.lineTo(w[0] + 12, w[1]);
          ctx.quadraticCurveTo(hip[0] + 30, hip[1] + 10, hip[0] + 34 + jt(50), hip[1] + 44);
          ctx.quadraticCurveTo(hip[0], hip[1] + 52, hip[0] - 34 + jt(51), hip[1] + 44);
          ctx.quadraticCurveTo(hip[0] - 30, hip[1] + 10, w[0] - 12, w[1]);
          ctx.closePath();
          ctx.fillStyle = o.dress; ctx.fill();
          ctx.strokeStyle = col; ctx.lineWidth = lw * 0.75; ctx.stroke();
        }
        line([hip, neck], col, lw);
        line(armF, col, lw);
        if (o.fists) { circle(armF[2][0], armF[2][1], 5.5, col); circle(armB[2][0], armB[2][1], 5.5, col); }

        // Cabeza
        if (o.bun) {
          const bx = head[0] + Math.cos(ht + Math.PI * 1.18) * HR * 1.05;
          const by = head[1] + Math.sin(ht + Math.PI * 1.18) * HR * 1.05;
          circle(bx, by, 10.5, o.hair || col);
        }
        circle(head[0], head[1], HR, o.headFill || "#16181f", col, lw);
        if (o.bun) {
          ctx.beginPath();
          ctx.arc(head[0], head[1], HR - 1, ht + Math.PI * 0.98, ht + Math.PI * 1.72);
          ctx.strokeStyle = o.hair || col; ctx.lineWidth = lw * 1.9; ctx.lineCap = "round"; ctx.stroke();
        }
        // Cara
        ctx.save();
        ctx.translate(head[0], head[1]);
        ctx.rotate(ht);
        const lx = o.look == null ? 6 : o.look;
        const ly = o.lookY || 0;
        const flw = Math.max(2.5, lw * 0.5);
        let eyes = o.eyes || "open";
        const bp = (T + id * 1.37) % 3.6;
        if (o.blink !== false && bp < 0.12 && eyes !== "closed" && eyes !== "happy") eyes = "closed";
        const ex = [lx - 8, lx + 8], ey = ly - 3;
        if (eyes === "open") { circle(ex[0], ey, 3.6, col); circle(ex[1], ey, 3.6, col); }
        else if (eyes === "wide") {
          circle(ex[0], ey, 6.5, null, col, flw * 0.8); circle(ex[1], ey, 6.5, null, col, flw * 0.8);
          circle(ex[0] + 1, ey, 2.4, col); circle(ex[1] + 1, ey, 2.4, col);
        } else if (eyes === "closed") {
          line([[ex[0] - 4, ey], [ex[0] + 4, ey]], col, flw); line([[ex[1] - 4, ey], [ex[1] + 4, ey]], col, flw);
        } else if (eyes === "happy") {
          ctx.beginPath(); ctx.arc(ex[0], ey + 2, 4.5, Math.PI * 1.1, Math.PI * 1.9); ctx.strokeStyle = col; ctx.lineWidth = flw; ctx.stroke();
          ctx.beginPath(); ctx.arc(ex[1], ey + 2, 4.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
        }
        if (o.brows === "angry") {
          line([[ex[0] - 6, ey - 12], [ex[0] + 5, ey - 7]], col, flw);
          line([[ex[1] + 6, ey - 12], [ex[1] - 5, ey - 7]], col, flw);
        } else if (o.brows === "sad") {
          line([[ex[0] - 6, ey - 7], [ex[0] + 5, ey - 12]], col, flw);
          line([[ex[1] + 6, ey - 7], [ex[1] - 5, ey - 12]], col, flw);
        }
        const m = o.mouth || "flat";
        ctx.strokeStyle = col; ctx.lineWidth = flw; ctx.lineCap = "round";
        if (m === "smile") { ctx.beginPath(); ctx.arc(lx, ly + 5, 8, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke(); }
        else if (m === "frown") { ctx.beginPath(); ctx.arc(lx, ly + 17, 7, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke(); }
        else if (m === "o") { circle(lx, ly + 11, 4.5, null, col, flw); }
        else if (m === "flat") { line([[lx - 6, ly + 11], [lx + 6, ly + 11]], col, flw); }
        else if (m === "grit") {
          ctx.beginPath(); ctx.rect(lx - 8, ly + 7, 16, 7); ctx.stroke();
          line([[lx - 8, ly + 10.5], [lx + 8, ly + 10.5]], col, flw * 0.6);
        }
        if (o.face) o.face(ctx, lx, ly, col, flw);
        ctx.restore();

        if (o.extra) o.extra({ hip, neck, sh, head, handF: armF[2], handB: armB[2], elbowF: armF[1], col, lw });
        ctx.restore();
      }

      // ---------- La Muerte ----------
      function reaper(x, y, s, o) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(o.rot || 0);
        ctx.scale(s, s);
        const sway = Math.sin(T * 2.4) * 5;
        // Guadaña
        line([[-30 + J(901, 1), -320], [70 + J(902, 1), 30]], "#8d8579", 8);
        ctx.beginPath();
        ctx.moveTo(-30, -320);
        ctx.quadraticCurveTo(-140, -372, -232, -268);
        ctx.quadraticCurveTo(-150, -318, -36, -296);
        ctx.closePath();
        ctx.fillStyle = "#c9cdd4"; ctx.fill();
        ctx.strokeStyle = "#6c7079"; ctx.lineWidth = 3; ctx.stroke();
        // Capa
        ctx.beginPath();
        ctx.moveTo(sway * 0.3, -262);
        ctx.bezierCurveTo(50, -262, 62, -200, 58, -150);
        ctx.bezierCurveTo(72, -80, 86, -30, 94 + sway, 0);
        for (let i = 0; i <= 8; i++) ctx.lineTo(94 - i * 23.5 + sway * (1 - i / 8), (i % 2 ? -20 : 0) + J(910 + i, 2.5));
        ctx.bezierCurveTo(-82, -40, -64, -110, -58, -150);
        ctx.bezierCurveTo(-60, -210, -48, -262, sway * 0.3, -262);
        ctx.closePath();
        ctx.fillStyle = "#07080b"; ctx.fill();
        ctx.strokeStyle = "#4a2f33"; ctx.lineWidth = 4; ctx.stroke();
        // Capucha
        ctx.beginPath(); ctx.ellipse(-6, -204, 30, 37, 0, 0, Math.PI * 2); ctx.fillStyle = "#000"; ctx.fill();
        // Mano huesuda en el mango
        circle(30, -110, 9, "#d8d2c6");
        // Ojos rojos
        const eg = o.eyes == null ? 1 : o.eyes;
        if (eg > 0) {
          ctx.save();
          ctx.shadowColor = "#ff3b2f"; ctx.shadowBlur = 24;
          circle(-17, -210, 5.5, rgba("#ff4a3a", eg));
          circle(5, -210, 5.5, rgba("#ff4a3a", eg));
          ctx.restore();
        }
        ctx.restore();
      }

      // ---------- Muro de ladrillo con alambre de púas ----------
      function wall(x, y, w, h, o) {
        o = o || {};
        ctx.save();
        ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
        ctx.fillStyle = "#2b1a15"; ctx.fillRect(x, y, w, h);
        const bh = 34, bw = 78;
        for (let r = 0; r * bh < h + bh; r++) {
          const off = r % 2 ? bw / 2 : 0;
          for (let c = -1; c * bw < w + bw; c++) {
            const k = hash(r * 37 + c * 11 + (o.seed || 0));
            ctx.fillStyle = mix("#5d3a2e", "#7a4b39", k);
            ctx.fillRect(x + c * bw + off + 3, y + r * bh + 3, bw - 6, bh - 6);
          }
        }
        if (o.shade) { ctx.fillStyle = "rgba(0,0,0," + o.shade + ")"; ctx.fillRect(x, y, w, h); }
        ctx.restore();
        if (o.wire !== false) barbed(x, y, w, o.wireP == null ? 1 : o.wireP);
      }
      function barbed(x, y, w, prog) {
        const end = x + w * prog;
        for (let px = x + 30; px < end; px += 130) line([[px, y], [px - 6, y - 70]], "#3c3a38", 6);
        if (prog <= 0) return;
        for (let row = 0; row < 2; row++) {
          const yy = y - 28 - row * 26;
          const pts = [];
          for (let px = x; px <= end; px += 20) pts.push([px, yy + Math.sin(px * 0.09 + row) * 4]);
          if (pts.length > 1) line(pts, "#8b8781", 3);
          for (let px = x + 10; px <= end; px += 46) {
            line([[px - 6, yy - 6], [px + 6, yy + 6]], "#8b8781", 2.5);
            line([[px + 6, yy - 6], [px - 6, yy + 6]], "#8b8781", 2.5);
          }
        }
      }

      // ---------- Ciudad, nubes, lluvia ----------
      const SKYLINE = [];
      (function () {
        let x = -260;
        let i = 0;
        while (x < W + 260) {
          const w = 70 + hash(i * 3.1) * 90;
          const h = 140 + hash(i * 5.7) * 220;
          const roof = hash(i * 9.3) < 0.55 ? "pitch" : hash(i * 2.9) < 0.75 ? "flat" : "spire";
          SKYLINE.push({ x, w, h, roof, i });
          x += w - 4;
          i++;
        }
      })();
      function skyline(gy, col, lights, lightsOff) {
        SKYLINE.forEach((b) => {
          ctx.fillStyle = col;
          ctx.beginPath();
          ctx.moveTo(b.x, gy);
          ctx.lineTo(b.x, gy - b.h);
          if (b.roof === "pitch") ctx.lineTo(b.x + b.w / 2, gy - b.h - 50);
          if (b.roof === "spire") { ctx.lineTo(b.x + b.w * 0.42, gy - b.h); ctx.lineTo(b.x + b.w / 2, gy - b.h - 150); ctx.lineTo(b.x + b.w * 0.58, gy - b.h); }
          ctx.lineTo(b.x + b.w, gy - b.h);
          ctx.lineTo(b.x + b.w, gy);
          ctx.closePath();
          ctx.fill();
          if (!lights) return;
          for (let r = 0; r < Math.floor(b.h / 46); r++) {
            for (let c = 0; c < Math.floor(b.w / 30); c++) {
              const k = hash(b.i * 101 + r * 7 + c * 13);
              if (k > 0.45) continue;
              const off = lightsOff == null ? 99 : lightsOff + k * 2.2;
              if (T > off) continue;
              ctx.fillStyle = rgba("#ffc26b", 0.75 - k);
              ctx.fillRect(b.x + 12 + c * 30, gy - b.h + 24 + r * 46, 12, 16);
            }
          }
        });
      }
      function cloud(x, y, s, col, rim) {
        const blobs = [[0, 0, 90], [80, 20, 80], [-85, 25, 75], [160, 45, 60], [-160, 50, 55], [30, 50, 85]];
        blobs.forEach(([bx, by, r]) => circle(x + bx * s, y + by * s + 6 * s, r * s, rim));
        blobs.forEach(([bx, by, r]) => circle(x + bx * s, y + by * s, r * s, col));
      }
      function rain(alpha, n, speed) {
        ctx.strokeStyle = "rgba(190,205,230," + alpha + ")";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const x = hash(i * 1.7) * (W + 300) - 150;
          const y = fract(hash(i * 3.3) + T * speed * (0.8 + hash(i) * 0.4)) * (H + 200) - 200;
          ctx.moveTo(x, y); ctx.lineTo(x - 10, y + 46);
        }
        ctx.stroke();
      }
      function dust(n, col, seed) {
        for (let i = 0; i < n; i++) {
          const x = hash(i * 2.3 + seed) * W;
          const y = H - fract(hash(i * 4.1 + seed) + T * 0.025 * (0.5 + hash(i + seed))) * H;
          const a = 0.15 + 0.35 * Math.abs(Math.sin(T * 0.8 + i));
          circle(x + Math.sin(T * 0.6 + i) * 14, y, 1.5 + hash(i * 7 + seed) * 2.5, rgba(col, a));
        }
      }

      // Helper: Irena (usa el rig stick base)
      function irena(o) {
        return stick(Object.assign({ dress: GOLD, bun: true, hair: "#d9cdb8", id: 7 }, o));
      }

      // ======================================================================
      // ESCENA 1 (0 - 2.1): "…que aquellos pequeños olvidaran quiénes eran."
      // ======================================================================
      function scene1() {
        cam(1 + 0.02 * seg(T, 0, 2.1), 540, 820);
        sky("#2a2e37", "#0c0d12", 1170);
        skyline(1170, "#111219", false);
        for (let i = 0; i < 6; i++) {
          ctx.fillStyle = "rgba(175,190,210," + (0.028 + 0.02 * Math.sin(T * 0.7 + i)).toFixed(3) + ")";
          ctx.fillRect(-500, 560 + i * 112, W + 1000, 46);
        }
        ground(1170, "#090a0e", "#1a1c22");
        const fade = eIO(seg(T, 0.5, 1.75));
        const kids = [[320, 1168, 0.92], [455, 1173, 1.0], [590, 1170, 0.95], [720, 1174, 0.9]];
        kids.forEach((k, i) => {
          const sway = Math.sin(T * 1.1 + i * 1.3) * 0.05;
          stick({
            x: k[0], y: k[1], s: k[2], id: 21 + i, dir: i % 2 ? -1 : 1,
            col: mix("#e7eef7", "#464c58", fade),
            look: (i % 2 ? 1 : -1) * 4,
            eyes: "open", brows: "sad", mouth: fade > 0.55 ? "flat" : "frown",
            pose: Object.assign(idlePose(21 + i), { tilt: sway }),
          });
        });
        // Oficial que alinea a los niños
        const off = { aB: [-0.3, 1.5], aF: [0.22, 0.12], lB: [-0.16, 0], lF: [0.16, 0], lean: 0.02, tilt: 0 };
        const raise = eIO(seg(T, 0.7, 1.3));
        stick({
          x: 905, y: 1160, s: 2.7, id: 51, dir: -1, col: "#c8ced9",
          pose: { aB: [-0.3, 1.6 * raise], aF: [0.2, 0.15], lB: [-0.16, 0], lF: [0.16, 0], lean: 0.03, tilt: -0.03 },
          look: -4, eyes: "open", brows: "angry", mouth: "flat",
          extra: (q) => {
            ctx.beginPath();
            ctx.ellipse(q.head[0], q.head[1] - 8, 32, 18, 0, Math.PI, 0);
            ctx.closePath(); ctx.fillStyle = "#101116"; ctx.fill();
            ctx.fillStyle = RED; ctx.fillRect(q.head[0] - 32, q.head[1] - 15, 64, 6);
          },
        });
      }

      // ======================================================================
      // ESCENA 2 (2.1 - 7.0): "Por eso conservaba registros secretos con sus verdaderos nombres"
      // ======================================================================
      function sheet(x, y, w, rot, col) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
        ctx.fillStyle = col; ctx.fillRect(-w / 2, -16, w, 32);
        ctx.strokeStyle = "#8a7f68"; ctx.lineWidth = 2; ctx.strokeRect(-w / 2, -16, w, 32);
        ctx.restore();
      }
      function scene2() {
        cam(1 + 0.04 * seg(T, 2.1, 7.0), 545, 880);
        const bg = ctx.createRadialGradient(600, 920, 60, 600, 920, 1250);
        bg.addColorStop(0, "#3c2d1d"); bg.addColorStop(1, "#100c08");
        ctx.fillStyle = bg; ctx.fillRect(-500, -500, W + 1000, H + 1000);
        dust(42, "#ffdca0", 2);
        const ty = 1185;
        ctx.fillStyle = vgrad(ty, ty + 260, [[0, "#3a2a1e"], [1, "#140d08"]]);
        ctx.fillRect(-120, ty, W + 240, 360);
        line([[-120, ty], [W + 120, ty]], "#5a432e", 6);
        for (let i = 6; i >= 0; i--) sheet(835 + i * 3, ty - 10 - i * 8, 150 - i * 6, -0.03 * i, mix("#efe6d6", "#c3b79e", i / 6));
        // Lámpara
        const lx = 600;
        line([[lx, ty], [lx, 1010]], "#241d16", 11);
        ctx.beginPath();
        ctx.moveTo(lx - 78, 770); ctx.lineTo(lx + 78, 770); ctx.lineTo(lx + 22, 1010); ctx.lineTo(lx - 22, 1010);
        ctx.closePath(); ctx.fillStyle = "#241d16"; ctx.fill();
        const glow = ctx.createRadialGradient(lx, 830, 20, lx, 830, 560);
        glow.addColorStop(0, "rgba(255,210,132,0.5)"); glow.addColorStop(1, "rgba(255,210,132,0)");
        ctx.fillStyle = glow; ctx.fillRect(lx - 600, 560, 1200, 900);
        // Irena escribiendo
        const bob = 0.12 * Math.sin(T * 8.5);
        irena({
          x: 455, y: 1190, s: 2.5, dir: 1,
          pose: { aB: [0.12, 0.95], aF: [1.35 + bob, 0.72 - bob * 0.5], lB: [-0.18, 0.42], lF: [0.2, 0.55], lean: 0.3, tilt: 0.06 },
          look: 6, eyes: "open", brows: null, mouth: "smile",
          extra: (q) => { const hx = q.handF[0], hy = q.handF[1]; line([[hx, hy], [hx + 30, hy - 16]], GOLD, 5); },
        });
      }

      // ======================================================================
      // ESCENA 3 (7.0 - 11.0): "y los lugares donde habían sido escondidos."
      // ======================================================================
      function scene3() {
        cam(1 + 0.03 * seg(T, 7.0, 11.0), 540, 820);
        const bg = ctx.createRadialGradient(540, 800, 60, 540, 800, 1200);
        bg.addColorStop(0, "#4a3420"); bg.addColorStop(1, "#120d08");
        ctx.fillStyle = bg; ctx.fillRect(-500, -500, W + 1000, H + 1000);
        dust(44, "#ffd9a0", 4);
        // Mesa
        const ty = 1170;
        ctx.fillStyle = vgrad(ty, ty + 260, [[0, "#42301f"], [1, "#160f08"]]);
        ctx.fillRect(-140, ty, W + 280, 380);
        line([[-140, ty], [W + 140, ty]], "#6a513a", 6);
        // Cuaderno grande abierto
        const openK = eIO(seg(T, 7.0, 7.8));
        const cxA = 545, yTop = 760, ph = 200;
        const halfW = 175 * openK;
        ctx.save();
        ctx.translate(cxA, ty - 10);
        // Pila de lomo
        ctx.fillStyle = "#e2d4ae"; ctx.fillRect(-halfW - 6, -ph - 6, 2 * halfW + 12, 42);
        ctx.strokeStyle = "#5a4928"; ctx.lineWidth = 4; ctx.strokeRect(-halfW - 6, -ph - 6, 2 * halfW + 12, 42);
        ctx.fillStyle = mix("#d6c79a", "#efe6d6", 0.65);
        ctx.beginPath();
        ctx.moveTo(-halfW, -ph); ctx.lineTo(halfW, -ph); ctx.lineTo(halfW, 0); ctx.lineTo(-halfW, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#6a5a3a"; ctx.lineWidth = 3; ctx.stroke();
        // Línea de apertura
        line([[0, -ph], [0, 0]], "#3a2d1a", 3);
        // Pinceladas de texto (más en la página izq.)
        const rowsN = Math.floor(9 * openK);
        for (let r = 0; r < rowsN; r++) {
          const yy = -ph + 28 + r * 19;
          const x0 = -halfW + 22, x1 = -halfW + 22 + (halfW - 50) * (0.5 + 0.4 * hash(r * 2.7));
          line([[x0, yy], [x1, yy]], rgba("#3a2d1a", 0.42 + 0.22 * hash(r * 3.1)), 2.4);
        }
        // "Nombre" sublimado en dorado al centro
        const goldK = eOut(seg(T, 8.0, 8.7));
        if (goldK > 0) {
          ctx.font = "44px " + FONT;
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillStyle = rgba(GOLD, 0.9 * goldK);
          ctx.fillText("NOMBRE", 0, -ph + 62);
        }
        ctx.restore();
        // Papeles con mini-mapa a los lados
        const papers = [[740, 1080, -8, 220], [850, 1140, 14, 190], [300, 1100, -18, 180]];
        papers.forEach((p, i) => {
          const a = eOut(seg(T, 7.2 + i * 0.15, 7.4 + i * 0.15));
          ctx.save(); ctx.globalAlpha = a; ctx.translate(p[0], p[1]); ctx.rotate(p[2] * Math.PI / 180);
          ctx.fillStyle = mix("#efe6d6", "#d1c5a3", i / 3);
          ctx.fillRect(-p[3] / 2, -20, p[3], 40);
          ctx.strokeStyle = "#6a5a3a"; ctx.lineWidth = 2; ctx.strokeRect(-p[3] / 2, -20, p[3], 40);
          for (let kI = 0; kI < 6; kI++) {
            const px = -p[3] / 2 + 8 + hash(i * 7 + kI) * (p[3] - 22);
            const py = -10 + hash(i * 13 + kI) * 20 - 6;
            circle(px, py, 2.5 + hash(i * 3 + kI) * 2, i === 1 && kI === 0 ? RED : "#4a3a22");
          }
          ctx.restore();
        });
        // Pines que caen sobre lugares
        const pins = [[700, 1058, 8.15], [772, 1108, 8.55], [330, 1068, 8.95]];
        pins.forEach((p) => {
          const k = seg(T, p[2], p[2] + 0.35);
          if (k <= 0 || k >= 1) return;
          const y = p[1] - (1 - eIn(k)) * 320;
          ctx.save();
          if (k >= 1) { ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.beginPath(); ctx.ellipse(p[0], p[1] + 16, 18, 5, 0, 0, Math.PI * 2); ctx.fill(); }
          ctx.translate(p[0], y);
          circle(0, -40, 22, GOLD, "#7a5414", 4);
          line([[0, -20], [0, 12]], GOLD, 8);
          ctx.restore();
        });
        // Irena mirando el cuaderno
        irena({
          x: 420, y: 1195, s: 2.4, dir: 1,
          pose: { aB: [0.05, 0.9], aF: [1.2, 0.95], lB: [-0.2, 0.3], lF: [0.22, 0.4], lean: 0.32, tilt: 0.18 },
          look: 7, lookY: 4, eyes: "open", brows: null, mouth: "smile",
        });
      }


      // ======================================================================
      // ESCENA 4 (11.0 - 17.5): "En 1943, la policía secreta nazi descubrió sus actividades."
      // ======================================================================
      function scene4() {
        const phase = T < 13.9 ? 0 : 1; // 0 = calendario 1943 / 1 = descubrimiento
        if (phase === 0) {
          cam(1.1 + 0.16 * eIO(seg(T, 11.0, 13.6)), 540, 640);
          const bg = ctx.createRadialGradient(540, 640, 40, 540, 640, 900);
          bg.addColorStop(0, "#2b2b32"); bg.addColorStop(1, "#05060a");
          ctx.fillStyle = bg; ctx.fillRect(-500, -500, W + 1000, H + 1000);
          // Hoja del calendario
          const yTop = 280, ch = 720;
          ctx.fillStyle = "#e8e2d2"; ctx.fillRect(280, yTop, 520, ch);
          ctx.fillStyle = "#1f1f28"; ctx.fillRect(280, yTop, 520, 110);
          ctx.fillStyle = RED; ctx.fillRect(280, yTop + 110, 520, 80);
          ctx.font = "88px " + FONT; ctx.textAlign = "left"; ctx.textBaseline = "middle";
          ctx.fillStyle = "#fff"; ctx.fillText("1943", 300, yTop + 58);
          ctx.font = "34px " + FONT; ctx.fillStyle = "#f0e0d0"; ctx.fillText("MARZO", 305, yTop + 152);
          // Cuadrícula
          const gx0 = 300, gy0 = yTop + 225, cols = 7, rows = 8, gw = 500, cw = gw / cols, chh = 300 / rows;
          for (let c = 1; c < cols; c++) line([[gx0 + c * cw, gy0], [gx0 + c * cw, gy0 + rows * chh]], "rgba(40,40,55,0.3)", 1.5);
          for (let r = 1; r < rows; r++) line([[gx0, gy0 + r * chh], [gx0 + gw, gy0 + r * chh]], "rgba(40,40,55,0.3)", 1.5);
          ctx.font = "24px " + FONT; ctx.textAlign = "center"; ctx.fillStyle = "#22222e";
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
            if (r === 3 && c === 2) continue;
            ctx.fillText(String(1 + r * 7 + c), gx0 + c * cw + cw / 2, gy0 + r * chh + chh / 2 + 8);
          }
          // Círculo rojo sobre un día
          const ringK = eIO(seg(T, 11.6, 12.4));
          if (ringK > 0) {
            const cx = gx0 + 2 * cw + cw / 2, cy = gy0 + 3 * chh + chh / 2;
            ctx.save();
            ctx.shadowColor = RED; ctx.shadowBlur = 24;
            circle(cx, cy, 38, null, RED, 6);
            ctx.restore();
            if (ringK < 1) circle(cx, cy, 38 + (1 - ringK) * 34, null, rgba(RED, 0.6 * (1 - ringK)), 3);
            ctx.font = "70px " + FONT; ctx.fillStyle = RED; ctx.textAlign = "center";
            ctx.fillText("8", cx, cy + 6);
          }
        } else {
          const k = seg(T, 13.9, 17.5);
          cam(1.15 + 0.1 * k, 540 + 28 * Math.sin(T - 13.9), 900);
          ctx.fillStyle = "#07080c"; ctx.fillRect(-500, -500, W + 1000, H + 1000);
          // Haz de linterna que barre
          const sweep = (T - 13.9) * 0.55 - 0.35;
          const lxA = 540 + Math.sin(sweep) * 380;
          ctx.beginPath();
          ctx.moveTo(lxA, 380); ctx.lineTo(lxA - 270, 1240); ctx.lineTo(lxA + 270, 1240); ctx.closePath();
          ctx.fillStyle = "rgba(255,226,150," + (0.22 + 0.12 * bump(T, 13.9, 0.3)).toFixed(3) + ")";
          ctx.fill();
          // Pila de papeles
          for (let i = 8; i >= 0; i--) {
            const wob = Math.sin(T * 0.8 + i) * 4;
            ctx.save(); ctx.translate(450 + i * 8 + wob, 1150 - i * 14); ctx.rotate(wob * 0.004);
            ctx.fillStyle = mix("#efe6d6", "#a99f88", i / 8); ctx.fillRect(-260, -18, 520, 36);
            ctx.strokeStyle = "#7a6c52"; ctx.lineWidth = 2; ctx.strokeRect(-260, -18, 520, 36);
            for (let r = 0; r < 3; r++) line([[-230 + r * 40, -6], [-30 - r * 30, -6]], rgba("#2c2318", 0.3 + 0.2 * hash(i + r)), 1.5);
            ctx.restore();
          }
          // Lupa (revela las "actividades")
          const mk = eOut(seg(T, 13.9, 15.0));
          const rx = 540 + 28 * Math.sin(T - 13.9), ry = 880;
          ctx.save(); ctx.globalAlpha = mk * 0.9;
          circle(rx - 120, ry - 110, 165 * mk, "rgba(235,240,255,0.9)", GOLD, 12);
          ctx.beginPath(); ctx.arc(rx - 120, ry - 110, 165 * mk, -0.7, 0.3);
          ctx.strokeStyle = rgba("#fff", mk * 0.5); ctx.lineWidth = 8; ctx.stroke();
          line([[rx - 120 + 140 * mk, ry - 110 + 120 * mk], [rx - 120 + 230 * mk, ry - 110 + 215 * mk]], GOLD, 18);
          ctx.restore();
          // Silueta del oficial apuntando
          stick({
            x: 850, y: 1205, s: 2.6, id: 63, dir: -1, col: "#c9ced9",
            pose: { aB: [-0.3, 1.62], aF: [0.2, 0.1], lB: [-0.18, 0], lF: [0.2, 0], lean: -0.05, tilt: -0.05 },
            look: -5, eyes: "wide", brows: "angry", mouth: "grit",
            extra: (q) => {
              ctx.beginPath(); ctx.ellipse(q.head[0], q.head[1] - 12, 34, 18, 0, Math.PI, 0);
              ctx.closePath(); ctx.fillStyle = "#101116"; ctx.fill();
              ctx.fillStyle = RED; ctx.fillRect(q.head[0] - 34, q.head[1] - 18, 68, 6);
            },
          });
          // Irena retrocediendo
          const back = seg(T, 16.8, 17.5);
          irena({
            x: 360 - 40 * back, y: 1200, s: 2.4, dir: 1,
            pose: blendPose(idlePose(7), { aB: [0.55, 1.9], aF: [0.55, 2.05], lB: [-0.18, 0], lF: [0.22, 0], lean: 0.1, tilt: -0.15 }, eIO(seg(T, 14.2, 14.6))),
            look: -6, eyes: "wide", brows: "sad", mouth: "o", sq: 1 - 0.09 * bump(T, 16.9, 0.25),
          });
        }
      }


      // ======================================================================
      // ESCENA 5 (17.5 - 20.0): "La arrestaron, la torturaron"
      // ======================================================================
      function scene5() {
        cam(1 + 0.05 * seg(T, 17.5, 20) + 0.02 * bump(T, 18.4, 0.4), 540, 900);
        const bg = ctx.createRadialGradient(540, 880, 60, 540, 880, 1150);
        bg.addColorStop(0, "#2c2622"); bg.addColorStop(1, "#08080a");
        ctx.fillStyle = bg; ctx.fillRect(-500, -500, W + 1000, H + 1000);
        // Suelo
        ctx.fillStyle = "#0b0c10"; ctx.fillRect(-500, 1280, W + 1000, H - 1280);
        line([[-500, 1280], [W + 500, 1280]], "#2a2a30", 4);
        // Luz de pared (parpadeo)
        const flick = 0.55 + 0.18 * Math.sin(T * 9) * Math.sin(T * 41);
        const lampG = ctx.createRadialGradient(820, 540, 20, 820, 540, 400);
        lampG.addColorStop(0, "rgba(255,210,132," + (0.6 * flick).toFixed(3) + ")");
        lampG.addColorStop(1, "rgba(255,210,132,0)");
        ctx.fillStyle = lampG; ctx.fillRect(480, 200, 720, 760);
        ctx.fillStyle = "#2a231c"; ctx.fillRect(770, 490, 100, 80);
        circle(820, 540, 36, "rgba(255,220,150," + flick.toFixed(3) + ")", "#7a5a2a", 4);
        // Barras de la celda (primer plano, abajo)
        for (let i = 0; i < 7; i++) {
          const x = 110 + i * 155;
          line([[x, 950], [x - 40, H + 160]], "#3a3a42", 20);
          line([[x, 950], [x - 40, H + 160]], "#25252c", 6);
        }
        // Sombra de Irena
        ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = "#000";
        ctx.beginPath(); ctx.moveTo(330, 1298); ctx.lineTo(470, 1298); ctx.lineTo(520, 1240);
        ctx.lineTo(455, 1040); ctx.lineTo(370, 1040); ctx.closePath(); ctx.fill(); ctx.restore();
        const strike = T > 18.32 && T < 18.72;
        const sq = strike ? 1 - 0.12 * bump(T, 18.4, 0.3) : 1;
        // Oficial con porra
        const armP = strike
          ? { aB: [0.5, -1.35], aF: [1.1, 1.5], lB: [0.18, 0], lF: [0.26, 0], lean: 0.5, tilt: -0.16 }
          : { aB: [0.5, -1.15], aF: [1.15, 1.3], lB: [0.2, 0], lF: [0.26, 0], lean: 0.3, tilt: -0.05 };
        stick({
          x: 720, y: 1300, s: 2.7, id: 66, dir: -1, col: "#cfd4df",
          pose: armP, look: -5, eyes: "open", brows: "angry", mouth: "grit",
          extra: (q) => {
            ctx.beginPath(); ctx.ellipse(q.head[0], q.head[1] - 12, 34, 18, 0, Math.PI, 0);
            ctx.closePath(); ctx.fillStyle = "#101116"; ctx.fill();
            ctx.fillStyle = RED; ctx.fillRect(q.head[0] - 34, q.head[1] - 18, 68, 6);
            const h = q.handF;
            line([[h[0], h[1]], [h[0] - 22, h[1] + 100]], "#4a3b2a", 20);
            circle(h[0] - 22, h[1] + 100, 16, "#160e08");
          },
        });
        // Irena cayendo / agarrada
        const fall = seg(T, 18.4, 19.3);
        const easeFall = eOut(fall) ** 0.6;
        const fallY = 1295 + 40 * easeFall;
        const fallRot = 0.5 * fall;
        irena({
          x: 430 - 20 * fall, y: fallY, s: 2.4, dir: 1, rot: -fallRot,
          pose: { aB: [2.35, -0.55], aF: [2.42, -0.66], lB: [-0.14, 0], lF: [0.2, 0], lean: -0.05, tilt: 0.22 - 0.4 * fall },
          look: -6, eyes: fall > 0.35 ? "closed" : "wide", brows: "sad", mouth: "o", sq,
        });
        // Chispas / impacto en el golpe
        if (T > 18.35 && T < 18.8) {
          const pp = clamp((T - 18.35) / 0.45, 0, 1);
          for (let i = 0; i < 9; i++) {
            const a = (i / 9) * Math.PI * 2 + T * 8;
            const r = 14 + 70 * pp;
            circle(530 + Math.cos(a) * r, 960 + Math.sin(a) * r * 0.7, 4 * (1 - pp) + 2, rgba("#ffcf8a", 0.7 - pp * 0.6));
          }
        }
        // Rostro dolido (gotas)
        if (T > 18.8) {
          const p = clamp((T - 18.8) / 0.5, 0, 1);
          ctx.save(); ctx.globalAlpha = (1 - p) * 0.7;
          for (let i = 0; i < 6; i++) {
            circle(428 + Math.cos(i * 1.1) * 12 * (1 + p * 4), 930 + Math.sin(i * 1.1) * 8 + 14 * p, 4 + p * 6, RED);
          }
          ctx.restore();
        }
      }


      // ---------- Grano de película y viñeta (espacio de pantalla) ----------
      const GRAIN = [];
      for (let g = 0; g < 4; g++) {
        const c = document.createElement("canvas");
        c.width = 220; c.height = 220;
        const gx = c.getContext("2d");
        const img = gx.createImageData(220, 220);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = hash(i * 0.37 + g * 1000) > 0.5 ? 255 : 0;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = Math.floor(hash(i * 0.91 + g * 77) * 40);
        }
        gx.putImageData(img, 0, 0);
        GRAIN.push(ctx.createPattern(c, "repeat"));
      }
      function overlays() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        FLASHES.forEach(([t0, a, col]) => {
          const p = seg(T, t0, t0 + 0.35);
          if (p <= 0 || p >= 1) return;
          ctx.fillStyle = rgba(col, a * (1 - eOut(p)));
          ctx.fillRect(0, 0, W, H);
        });
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = GRAIN[F12 % 4];
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
        const vg = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.28, W / 2, H * 0.45, H * 0.72);
        vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.6)");
        ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      }

      const SCENES = [scene1, scene2, scene3, scene4, scene5];
      function renderAt(t) {
        T = clamp(t, 0, END);
        F12 = Math.floor(T * 12);
        let idx = 0;
        CUTS.forEach((c, i) => { if (T >= c) idx = i; });
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.globalAlpha = 1;
        SCENES[idx]();
        overlays();
      }

      // El canvas se dibuja desde el tiempo de la línea de tiempo (determinista)
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);
      renderAt(0);
      if (document.fonts && document.fonts.load) document.fonts.load("100px " + FONT).then(() => renderAt(clock.t));
      window.__timelines["story"] = tl;
    })();
  </script>
</template>

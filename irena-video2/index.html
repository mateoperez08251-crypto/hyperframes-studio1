<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Irena Sendler — stickman</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0f1116;
        --ink: #efe6d6;
        --accent: #e3a83e;
        --font-display: "Archivo Black", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="story"
        data-composition-id="story"
        data-composition-src="compositions/story.html"
        data-start="0"
        data-duration="20"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>

      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="20"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>

      <!-- Voz: 0–20 s (FineVoice) — tramo "…olvidaran quiénes eran / 1943 / arrestaron y torturaron" -->
      <audio id="voice" class="clip" src="assets/voice/narracion.mp3" data-start="0" data-duration="19.8" data-track-index="3" data-volume="1" data-fade-out="0.15"></audio>

      <!-- SFX: el pico de cada sonido cae ~1 frame después de la acción visual -->
      <audio id="sfx-entrada" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.1" data-duration="0.55" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-lampara" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="2.18" data-duration="1.1" data-track-index="11" data-volume="0.22" data-fade-out="0.7"></audio>
      <audio id="sfx-papel" class="clip" src="assets/sfx/swosh.mp3" data-start="3.2" data-duration="0.2" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-gold" class="clip" src="assets/sfx/punch-snare.mp3" data-start="8.15" data-duration="0.35" data-track-index="13" data-volume="0.25"></audio>
      <audio id="sfx-pin1" class="clip" src="assets/sfx/punch-snare.mp3" data-start="8.5" data-duration="0.3" data-track-index="14" data-volume="0.22"></audio>
      <audio id="sfx-pin2" class="clip" src="assets/sfx/punch-snare.mp3" data-start="8.9" data-duration="0.3" data-track-index="15" data-volume="0.22"></audio>
      <audio id="sfx-1943" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="11.05" data-duration="1.3" data-track-index="16" data-volume="0.3" data-fade-out="0.8"></audio>
      <audio id="sfx-ring1943" class="clip" src="assets/sfx/punch-snare.mp3" data-start="12.3" data-duration="0.35" data-track-index="17" data-volume="0.25"></audio>
      <audio id="sfx-lupa" class="clip" src="assets/sfx/whoosh.mp3" data-start="13.92" data-duration="0.55" data-track-index="18" data-volume="0.5"></audio>
      <audio id="sfx-actividad" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="14.6" data-duration="0.5" data-track-index="19" data-volume="0.4"></audio>
      <audio id="sfx-arresto" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="17.55" data-duration="1.2" data-track-index="20" data-volume="0.32" data-fade-out="0.8"></audio>
      <audio id="sfx-porral" class="clip" src="assets/sfx/body-fall.mp3" data-start="18.4" data-duration="0.8" data-track-index="21" data-volume="2.2"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

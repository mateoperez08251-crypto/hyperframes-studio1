<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #07060c;
    }
    #vt-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
    /* Carga la fuente que usa el canvas */
    #vt-fontload {
      position: absolute;
      left: 0;
      top: 0;
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: 20px;
      color: rgba(0, 0, 0, 0.01);
      pointer-events: none;
    }
  </style>

  <div id="root" data-composition-id="story" data-width="1080" data-height="1920">
    <canvas id="vt-canvas" width="1080" height="1920" data-layout-allow-overflow></canvas>
    <div id="vt-fontload" data-layout-ignore>IRENA SENDLER 1940 1943 VARSOVIA POLONIA</div>
  </div>

  <script>
    (function () {
      // =====================================================================
      //  VITRAL VIVO — toda la historia es un vitral de catedral que se mueve.
      //  Cristal de colores + plomo negro + luz que lo atraviesa.
      // =====================================================================
      const W = 1080, H = 1920, END = 121.6;
      const cv = document.getElementById("vt-canvas");
      const ctx = cv.getContext("2d");
      const LEAD = "#110c0a";
      const SERIF = '"Playfair Display", serif';
      const TAU = Math.PI * 2;

      // ---------- Utilidades ----------
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const eOut = (k) => 1 - Math.pow(1 - k, 3);
      const eIn = (k) => k * k * k;
      const eIO = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      const eBack = (k) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
      const bump = (t, t0, d) => { const u = (t - t0) / d; return u < 0 || u > 1 ? 0 : Math.sin(Math.PI * u); };
      const fract = (x) => x - Math.floor(x);
      const hash = (n) => fract(Math.sin(n * 127.1 + 311.7) * 43758.5453);
      const hsl = (h, s, l, a) => "hsla(" + ((h % 360) + 360) % 360 + "," + clamp(s, 0, 100) + "%," + clamp(l, 0, 100) + "%," + (a == null ? 1 : clamp(a, 0, 1)) + ")";
      const polar = (cx, cy, r, a) => [cx + Math.cos(a) * r, cy + Math.sin(a) * r];

      let T = 0;   // tiempo actual
      let A = 1;   // opacidad de la escena (para el fundido antes de cada corte)
      function alpha(a) { ctx.globalAlpha = clamp(A * (a == null ? 1 : a), 0, 1); }

      // ---------- Cristal emplomado ----------
      function pathPts(p) {
        ctx.beginPath();
        ctx.moveTo(p[0][0], p[0][1]);
        for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
        ctx.closePath();
      }
      function bbox(p) {
        let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        p.forEach((q) => { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); });
        return { x0, y0, x1: Math.max(x1, x0 + 1), y1: Math.max(y1, y0 + 1) };
      }
      function glassFill(b, h, s, l, lum) {
        const g = ctx.createLinearGradient(b.x0, b.y0, b.x1, b.y1);
        g.addColorStop(0, hsl(h - 6, s, (l + 16) * lum));
        g.addColorStop(0.5, hsl(h, s, l * lum));
        g.addColorStop(1, hsl(h + 10, s * 0.9, (l - 12) * lum));
        return g;
      }
      function glow(col, blur) { ctx.shadowColor = col; ctx.shadowBlur = blur; }
      function noGlow() { ctx.shadowColor = "rgba(0,0,0,0)"; ctx.shadowBlur = 0; }
      function glass(p, h, s, l, o) {
        o = o || {};
        const lum = o.lum == null ? 1 : o.lum;
        pathPts(p);
        if (o.glow) glow(hsl(h, s + 10, 62, o.glow), o.blur || 30);
        ctx.fillStyle = glassFill(bbox(p), h, s, l, lum);
        ctx.fill();
        noGlow();
        if (o.lead !== 0) { ctx.lineJoin = "round"; ctx.lineWidth = o.lead || 7; ctx.strokeStyle = LEAD; ctx.stroke(); }
      }
      function glassCircle(x, y, r, h, s, l, o) {
        o = o || {};
        const lum = o.lum == null ? 1 : o.lum;
        ctx.beginPath(); ctx.arc(x, y, Math.max(1, r), 0, TAU);
        if (o.glow) glow(hsl(h, s + 10, 62, o.glow), o.blur || 36);
        const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, Math.max(2, r));
        g.addColorStop(0, hsl(h - 6, s, (l + 20) * lum));
        g.addColorStop(1, hsl(h + 8, s, (l - 10) * lum));
        ctx.fillStyle = g; ctx.fill(); noGlow();
        if (o.lead !== 0) { ctx.lineWidth = o.lead || 7; ctx.strokeStyle = LEAD; ctx.stroke(); }
      }
      function leadLine(pts, w, col) {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.lineWidth = w || 6; ctx.strokeStyle = col || LEAD; ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.stroke();
      }
      function ringPiece(cx, cy, r0, r1, a0, a1, n) {
        const p = [];
        n = n || 4;
        for (let i = 0; i <= n; i++) p.push(polar(cx, cy, r1, lerp(a0, a1, i / n)));
        for (let i = n; i >= 0; i--) p.push(polar(cx, cy, r0, lerp(a0, a1, i / n)));
        return p;
      }
      function rectPts(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }

      // ---------- Luz ----------
      function aura(x, y, r, hue, amt, sat) {
        if (amt <= 0) return;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, hsl(hue, sat == null ? 90 : sat, 62, 0.5 * amt * A));
        g.addColorStop(1, hsl(hue, sat == null ? 90 : sat, 50, 0));
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
        ctx.restore();
      }
      function rays(x, y, amt, hue, rot, n) {
        if (amt <= 0) return;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        n = n || 10;
        for (let i = 0; i < n; i++) {
          const a = rot + (i / n) * TAU + Math.sin(T * 0.4 + i) * 0.05;
          const w = 0.05 + hash(i * 3.3) * 0.07;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + Math.cos(a - w) * 1900, y + Math.sin(a - w) * 1900);
          ctx.lineTo(x + Math.cos(a + w) * 1900, y + Math.sin(a + w) * 1900);
          ctx.closePath();
          const g = ctx.createRadialGradient(x, y, 0, x, y, 1300);
          g.addColorStop(0, hsl(hue, 90, 72, 0.24 * amt * A));
          g.addColorStop(1, hsl(hue, 90, 60, 0));
          ctx.fillStyle = g;
          ctx.fill();
        }
        ctx.restore();
      }
      function veil(a, col) {
        if (a <= 0) return;
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = col ? col.replace("A", String(clamp(a, 0, 1))) : "rgba(4,3,8," + clamp(a, 0, 1) + ")";
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
      function motes(n, hue, seed, amt) {
        if (amt <= 0) return;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (let i = 0; i < n; i++) {
          const x = hash(i * 2.3 + seed) * W + Math.sin(T * 0.5 + i) * 18;
          const y = H - fract(hash(i * 4.1 + seed) + T * 0.02 * (0.5 + hash(i + seed))) * H;
          const a = (0.2 + 0.5 * Math.abs(Math.sin(T * 0.9 + i))) * amt * A;
          ctx.fillStyle = hsl(hue, 90, 75, a);
          ctx.beginPath(); ctx.arc(x, y, 1.6 + hash(i * 7 + seed) * 2.6, 0, TAU); ctx.fill();
        }
        ctx.restore();
      }

      // ---------- Grietas y astillas ----------
      function cracks(x, y, seed, n, len, prog, col, w) {
        if (prog <= 0) return;
        ctx.save();
        ctx.strokeStyle = col || "rgba(235,240,255,0.85)";
        ctx.lineWidth = w || 3;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (let i = 0; i < n; i++) {
          let a = (i / n) * TAU + hash(seed + i) * 0.6, px = x, py = y;
          const L = len * (0.6 + hash(seed * 3 + i) * 0.6) * prog;
          const steps = 7;
          ctx.beginPath();
          ctx.moveTo(px, py);
          for (let k = 1; k <= steps; k++) {
            a += (hash(seed + i * 13 + k) - 0.5) * 0.7;
            px += (Math.cos(a) * L) / steps;
            py += (Math.sin(a) * L) / steps;
            ctx.lineTo(px, py);
            if (k === 3 && hash(seed + i * 5) > 0.4) {
              const ba = a + (hash(seed + i * 9) > 0.5 ? 0.7 : -0.7);
              ctx.lineTo(px + Math.cos(ba) * L * 0.3, py + Math.sin(ba) * L * 0.3);
              ctx.moveTo(px, py);
            }
          }
          ctx.stroke();
        }
        ctx.restore();
      }
      function shards(x, y, t, n, seed, hues, spread, l) {
        if (t <= 0 || t > 2.2) return;
        for (let i = 0; i < n; i++) {
          const a = hash(seed + i) * TAU;
          const v = (300 + hash(seed + i * 3) * 900) * (spread || 1);
          const px = x + Math.cos(a) * v * t;
          const py = y + Math.sin(a) * v * t + 700 * t * t;
          const r = 14 + hash(seed + i * 7) * 26;
          const rot = t * (hash(seed + i * 11) - 0.5) * 14;
          const pts = [0, 1, 2].map((k) => { const aa = rot + (k * TAU) / 3 + hash(seed + i + k) * 0.8; return [px + Math.cos(aa) * r, py + Math.sin(aa) * r]; });
          alpha(1 - seg(t, 1.1, 2.2));
          glass(pts, hues[i % hues.length], 80, l == null ? 55 : l, { lead: 3 });
        }
        alpha(1);
      }

      // ---------- Texto emplomado ----------
      function leadText(str, x, y, size, h, s, l, o) {
        o = o || {};
        const lum = o.lum == null ? 1 : o.lum;
        ctx.save();
        ctx.font = "900 " + size + "px " + SERIF;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        if (o.glow) glow(hsl(h, 90, 60, o.glow), 40);
        ctx.lineJoin = "round";
        ctx.lineWidth = size * 0.13;
        ctx.strokeStyle = LEAD;
        ctx.strokeText(str, x, y);
        noGlow();
        const g = ctx.createLinearGradient(x - size * 0.5, y - size * 0.6, x + size * 0.5, y + size * 0.6);
        g.addColorStop(0, hsl(h - 8, s, (l + 20) * lum));
        g.addColorStop(0.5, hsl(h, s, l * lum));
        g.addColorStop(1, hsl(h + 12, s, (l - 12) * lum));
        ctx.fillStyle = g;
        ctx.fillText(str, x, y);
        ctx.restore();
      }
      // Cada letra entra como una pieza de cristal que se encaja
      function leadWord(str, x, y, size, h, s, l, t0, stagger, o) {
        o = o || {};
        const chars = Array.from(str);
        ctx.save();
        ctx.font = "900 " + size + "px " + SERIF;
        const ws = chars.map((ch) => ctx.measureText(ch).width);
        const gap = size * 0.03;
        const tw = ws.reduce((a, b) => a + b, 0) + (chars.length - 1) * gap;
        ctx.restore();
        let cx = x - tw / 2;
        chars.forEach((ch, i) => {
          const p = seg(T, t0 + i * stagger, t0 + i * stagger + 0.4);
          const w = ws[i];
          if (p > 0 && ch !== " ") {
            const k = eBack(p);
            ctx.save();
            ctx.translate(cx + w / 2, y - (1 - eOut(p)) * 60);
            ctx.rotate((1 - Math.min(1, k)) * (hash(i * 7 + chars.length) - 0.5) * 1.4);
            ctx.scale(Math.max(0.01, k), Math.max(0.01, k));
            alpha(Math.min(1, p * 2.5) * (o.a == null ? 1 : o.a));
            leadText(ch, 0, 0, size, h + (i % 2) * 10, s, l, o);
            ctx.restore();
          }
          cx += w + gap;
        });
        alpha(1);
      }

      // ---------- Mosaico de fondo (el vitral entero) ----------
      const NX = 7, NY = 13;
      const GP = [];
      for (let j = 0; j <= NY; j++) {
        GP.push([]);
        for (let i = 0; i <= NX; i++) {
          let x = (i * W) / NX, y = (j * H) / NY;
          if (i > 0 && i < NX) x += (hash(i * 17.3 + j * 5.1) - 0.5) * (W / NX) * 0.6;
          if (j > 0 && j < NY) y += (hash(i * 3.7 + j * 11.9) - 0.5) * (H / NY) * 0.6;
          GP[j].push([x, y]);
        }
      }
      const CELLS = [];
      for (let j = 0; j < NY; j++) {
        for (let i = 0; i < NX; i++) {
          const a = GP[j][i], b = GP[j][i + 1], c = GP[j + 1][i + 1], d = GP[j + 1][i];
          const r = hash(i * 7.7 + j * 13.1);
          const polys = r < 0.45 ? (r < 0.22 ? [[a, b, c], [a, c, d]] : [[a, b, d], [b, c, d]]) : [[a, b, c, d]];
          polys.forEach((p, k) => {
            const cx = p.reduce((s, q) => s + q[0], 0) / p.length;
            const cy = p.reduce((s, q) => s + q[1], 0) / p.length;
            CELLS.push({ p, cx, cy, r: hash(i * 31.3 + j * 17.9 + k * 5.3), r2: hash(i * 3.1 + j * 9.7 + k * 1.9), d: Math.hypot(cx - W / 2, cy - H * 0.4) / Math.hypot(W / 2, H * 0.6), bb: bbox(p) });
          });
        }
      }
      const val = (v, c) => (typeof v === "function" ? v(c) : v);
      function cellColor(si, c) {
        const b = SC[si].bg;
        const hs = b.h;
        const h = hs[Math.floor(c.r * hs.length) % hs.length] + (c.r2 - 0.5) * 14;
        let l = lerp(b.l[0], b.l[1], c.r2);
        const d = Math.hypot(c.cx - (b.lx == null ? 540 : b.lx), c.cy - (b.ly == null ? 760 : b.ly));
        l += (b.la || 0) * Math.max(0, 1 - d / (b.lr || 700));
        const lum = b.lum == null ? 1 : val(b.lum, c);
        return [h, val(b.s, c), l, lum];
      }
      function drawMosaic() {
        const si = sceneAt(T);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        CELLS.forEach((c) => {
          let idx = si, sx = 1, flash = 0;
          for (let n = 1; n < CUTS.length; n++) {
            const cut = CUTS[n];
            if (T < cut - 0.35 || T > cut + 0.75) continue;
            const delay = c.d * 0.55;
            const f = seg(T, cut - 0.35 + delay, cut - 0.05 + delay);
            idx = f < 0.5 ? n - 1 : n;
            sx = Math.max(0.06, Math.abs(Math.cos(Math.PI * f)));
            flash = Math.sin(Math.PI * f);
            break;
          }
          const col = cellColor(idx, c);
          ctx.save();
          ctx.translate(c.cx, c.cy); ctx.scale(sx, 1); ctx.translate(-c.cx, -c.cy);
          pathPts(c.p);
          ctx.fillStyle = glassFill(c.bb, col[0], col[1], col[2], col[3]);
          ctx.fill();
          if (flash > 0) { ctx.fillStyle = "rgba(255,236,190," + 0.3 * flash + ")"; ctx.fill(); }
          ctx.lineWidth = 9; ctx.strokeStyle = LEAD; ctx.lineJoin = "round"; ctx.stroke();
          ctx.restore();
        });
      }

      // ---------- Figuras de vitral (santos de catedral) ----------
      const FACE = "rgba(46,24,14,0.92)";
      function face(x, y, r, o) {
        ctx.strokeStyle = FACE; ctx.lineWidth = 3.6; ctx.lineCap = "round";
        const lx = o.look || 0, ey = y - 4;
        if (o.eyes === "open") {
          [-13, 13].forEach((dx) => {
            ctx.beginPath(); ctx.ellipse(x + dx + lx, ey, 7.5, 4.8, 0, 0, TAU);
            ctx.fillStyle = "rgba(250,240,220,0.95)"; ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(x + dx + lx * 1.3 + 1, ey, 2.8, 0, TAU); ctx.fillStyle = FACE; ctx.fill();
          });
        } else {
          [-13, 13].forEach((dx) => { ctx.beginPath(); ctx.arc(x + dx + lx, ey - 1, 6, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke(); });
        }
        const sad = o.sad ? 1 : 0;
        ctx.beginPath(); ctx.moveTo(x - 21 + lx, ey - 12 - sad * 3); ctx.quadraticCurveTo(x - 13 + lx, ey - 17, x - 5 + lx, ey - 12 + sad * 4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 21 + lx, ey - 12 - sad * 3); ctx.quadraticCurveTo(x + 13 + lx, ey - 17, x + 5 + lx, ey - 12 + sad * 4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + lx, ey - 6); ctx.lineTo(x + lx - 3, ey + 10); ctx.lineTo(x + lx + 3, ey + 11); ctx.stroke();
        ctx.beginPath();
        if (o.smile) ctx.arc(x + lx, y + 10, 8, Math.PI * 0.2, Math.PI * 0.8);
        else if (sad) ctx.arc(x + lx, y + 25, 7, Math.PI * 1.2, Math.PI * 1.8);
        else { ctx.moveTo(x + lx - 6, y + 18); ctx.lineTo(x + lx + 6, y + 18); }
        ctx.stroke();
        ctx.fillStyle = "rgba(220,90,80,0.24)";
        ctx.beginPath(); ctx.arc(x - 20 + lx, y + 10, 6, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 20 + lx, y + 10, 6, 0, TAU); ctx.fill();
      }
      function figure(o) {
        const s = o.s || 1, k = o.kind || "person", lum = o.lum == null ? 1 : o.lum;
        const R = o.robe || [40, 75, 48], SK = o.skin || [28, 55, 74];
        const soldier = k === "soldier", child = k === "child";
        const sat = o.sat == null ? 1 : o.sat;
        ctx.save();
        ctx.translate(o.x, o.y + (o.bob || 0));
        ctx.rotate(o.rot || 0);
        ctx.scale(s * (o.dir || 1), s);
        alpha(o.a == null ? 1 : o.a);
        const hy = child ? -250 : -276;
        if (o.halo > 0) {
          aura(0, hy, 150, 44, o.halo * 0.9);
          const n = 14, spin = T * 0.25;
          for (let i = 0; i < n; i++) {
            const a0 = spin + (i / n) * TAU, a1 = spin + ((i + 1) / n) * TAU;
            glass(ringPiece(0, hy, 50, 82, a0, a1, 3), 42 + (i % 2) * 10, 92 * sat, 56, { lum: lum * (0.45 + 0.6 * o.halo), lead: 5 });
          }
        }
        const shW = soldier ? 46 : child ? 34 : 40, hemW = soldier ? 62 : child ? 62 : 84;
        const top = child ? -212 : -232;
        const arm = (ang, side, front) => {
          const sx = side * (shW - 6), sy = top + 10;
          const dx = side * Math.sin(ang), dy = Math.cos(ang);
          const L = child ? 96 : 118, px = -dy, py = dx;
          const ex = sx + dx * L, ey = sy + dy * L;
          glass([[sx + px * 13, sy + py * 13], [ex + px * 9, ey + py * 9], [ex - px * 9, ey - py * 9], [sx - px * 13, sy - py * 13]], R[0] + (front ? 0 : -8), R[1] * sat, R[2] + (front ? 4 : -8), { lum, lead: 6 });
          glassCircle(ex, ey, 13, SK[0], SK[1] * sat, SK[2], { lum, lead: 5 });
          return [ex, ey];
        };
        arm(o.armB == null ? 0.2 : o.armB, -1, false);
        const P = [[-shW, top + 2], [-shW * 0.35, top], [shW * 0.35, top], [shW, top + 2], [hemW, 0], [hemW * 0.33, 0], [-hemW * 0.33, 0], [-hemW, 0]];
        glass([P[0], P[1], P[6], P[7]], R[0] - 6, R[1] * sat, R[2] - 6, { lum, lead: 7 });
        glass([P[1], P[2], P[5], P[6]], R[0] + 4, R[1] * sat, R[2] + 8, { lum, lead: 7 });
        glass([P[2], P[3], P[4], P[5]], R[0] - 6, R[1] * sat, R[2] - 6, { lum, lead: 7 });
        const by = top * 0.55, bw = lerp(shW, hemW, (by - top) / (0 - top));
        const BL = o.belt || [44, 85, 52];
        glass([[-bw, by - 12], [bw, by - 12], [bw * 1.01, by + 10], [-bw * 1.01, by + 10]], BL[0], BL[1] * sat, BL[2], { lum, lead: 5 });
        glass([[-11, top + 4], [11, top + 4], [9, hy + 30], [-9, hy + 30]], SK[0], SK[1] * sat, SK[2] - 6, { lum, lead: 5 });
        const HR = child ? 36 : 40;
        if (soldier) {
          glassCircle(0, hy, HR, 24, 20, 20, { lum, lead: 6 });
          glass([[-HR - 18, hy - 4], [HR + 18, hy - 4], [HR + 8, hy - 16], [HR * 0.8, hy - HR * 0.9], [0, hy - HR * 1.15], [-HR * 0.8, hy - HR * 0.9], [-HR - 8, hy - 16]], 95, 12, 30, { lum, lead: 6 });
          ctx.fillStyle = hsl(0, 90, 55, 0.85);
          ctx.fillRect(-19, hy + 6, 11, 4); ctx.fillRect(8, hy + 6, 11, 4);
        } else {
          glassCircle(0, hy, HR, SK[0], SK[1] * sat, SK[2], { lum, lead: 6 });
          if (k === "irena") {
            const p = [];

            glassCircle(px, py, 12, 44, 95, 62, { lead: 3 });
          }
        }
        veil(0.35 * seg(T, 89.6, 90.6), "rgba(4,8,30,A)");
      });

      // 14 · 92.16–98.80 "Durante décadas, gran parte del mundo desconoció su extraordinaria historia."
      scene(92.16, { h: [30, 40, 210], s: () => lerp(25, 6, seg(T, 92.5, 96)), l: [8, 16], lum: 0.75 }, () => {
        cam(1 + 0.04 * seg(T, 92.16, 98.8), 540, 780);
        const gx = 540, gy = 760, R = 330;
        const grey = seg(T, 93.0, 96.0);
        glassCircle(gx, gy, R, 205, 55 * (1 - 0.8 * grey), 36, { lead: 14 });
        ctx.save();
        ctx.beginPath(); ctx.arc(gx, gy, R - 6, 0, TAU); ctx.clip();
        const rot = T * 0.25;
        for (let i = 0; i < 6; i++) {
          const ph = rot + (i / 6) * Math.PI;
          const cx = gx + Math.cos(ph) * R * 0.6, vis = Math.sin(ph);
          if (vis < 0) continue;
          const pts = [];
          for (let k = 0; k < 9; k++) { const a = (k / 9) * TAU; const rr = (60 + hash(i * 9 + k) * 50) * vis; pts.push([cx + Math.cos(a) * rr, gy - 160 + i * 60 + Math.sin(a) * rr * 0.8]); }
          glass(pts, 110, 45 * (1 - 0.8 * grey), 36, { lead: 6 });
        }
        for (let i = 0; i < 6; i++) {
          const ph = rot + (i / 6) * Math.PI;
          ctx.beginPath(); ctx.ellipse(gx, gy, Math.abs(Math.cos(ph)) * R, R, 0, 0, TAU);
          ctx.lineWidth = 6; ctx.strokeStyle = LEAD; ctx.stroke();
        }
        [-0.5, 0, 0.5].forEach((v) => { ctx.beginPath(); ctx.ellipse(gx, gy + v * R, R * Math.sqrt(1 - v * v), 30, 0, 0, TAU); ctx.lineWidth = 6; ctx.strokeStyle = LEAD; ctx.stroke(); });
        // polvo del olvido
        for (let i = 0; i < 160; i++) {
          if (hash(i * 1.7) > grey) continue;
          ctx.fillStyle = "rgba(150,140,130," + 0.5 * A + ")";
          ctx.fillRect(gx - R + hash(i * 3.1) * 2 * R, gy - R + hash(i * 5.3) * 2 * R, 5, 5);
        }
        ctx.restore();
        const year = Math.floor(lerp(1945, 1999, seg(T, 92.8, 96.2)));
        alpha(seg(T, 92.4, 92.8));
        leadText(String(year), 540, 260, 140, 35, 40, 55, { lum: 1 - 0.3 * grey });
        alpha(1);
        const spark = seg(T, 96.8, 97.3);
        if (spark > 0) {
          aura(575, 600, 120, 44, spark * (0.7 + 0.3 * Math.sin(T * 8)));
          glassCircle(575, 600, 12 * spark, 44, 95, 64, { lead: 3 });
        }
      });

      // 15 · 98.80–105.20 "Y mientras tantos nombres quedaron escritos en los libros por haber provocado destrucción,"
      const BOOKS = [];
      [880, 1270].forEach((sy, row) => {
        let x = 110;
        for (let i = 0; x < 960; i++) {
          const w = 70 + hash(row * 50 + i * 3.1) * 40, h = 240 + hash(row * 50 + i * 7.7) * 70;
          if (x + w > 970) break;
          BOOKS.push({ x, w, h, sy, n: BOOKS.length });
          x += w + 6;
        }
      });
      scene(98.8, { h: [0, 20, 350], s: 20, l: [6, 12], lum: 0.8 }, () => {
        cam(1 + 0.04 * seg(T, 98.8, 105.2), 540, 900);
        [880, 1270].forEach((sy) => glass(rectPts(80, sy, 920, 30), 25, 35, 24, { lead: 7 }));
        BOOKS.forEach((b) => {
          const t0 = 99.5 + b.n * 0.07, k = eOut(seg(T, t0, t0 + 0.4));
          if (k <= 0) return;
          const y = b.sy - b.h - (1 - k) * 900;
          glass(rectPts(b.x, y, b.w, b.h), hash(b.n * 2.3) * 30 - 10, 25, 22 + hash(b.n) * 8, { lead: 6 });
          glass(rectPts(b.x + 8, y + 30, b.w - 16, 14), 0, 10, 12, { lead: 3 });
          glass(rectPts(b.x + 8, y + b.h - 50, b.w - 16, 14), 0, 10, 12, { lead: 3 });
          glassCircle(b.x + b.w / 2, y + b.h / 2, Math.min(18, b.w * 0.22), 0, 50, 22, { lead: 4 });
        });
        const burn = seg(T, 103.36, 104.6);
        cracks(540, 760, 29, 10, 700, burn, "rgba(255,90,60,0.7)", 4);
        aura(540, 1000, 700, 8, 0.5 * burn);
        shards(540, 600, T - 104.0, 18, 303, [0, 350, 10], 0.8, 16);
      });

      // 16 · 105.20–115.35 "el de Irena Sendler merece recordarse por haber protegido la vida, porque incluso en los momentos más oscuros de la humanidad."
      scene(105.2, { h: [42, 35, 50, 28], s: 70, l: [10, 20], la: 22, ly: 760, lum: (c) => 1 - (c.d > 0.32 ? 0.6 : 0.2) * seg(T, 112.4, 114.4) }, () => {
        cam(1 + 0.04 * seg(T, 105.2, 115.35), 540, 800);
        const out = eIO(seg(T, 109.2, 109.8));
        if (out < 1) {
          ctx.save();
          ctx.translate(540, 640 - 200 * out); ctx.scale(1 - 0.4 * out, 1 - 0.4 * out); ctx.translate(-540, -640);
          alpha(1 - out);
          const op = eOut(seg(T, 105.3, 105.9));
          aura(540, 640, 600, 44, 0.4 + 0.6 * seg(T, 107.04, 107.8));
          rays(540, 640, 0.9 * seg(T, 107.04, 107.8), 44, T * 0.15);
          glass([[540, 420], [540 - 420 * op, 400], [540 - 420 * op, 880], [540, 900]], 44, 55, 80, { lead: 8 });
          glass([[540, 420], [540 + 420 * op, 400], [540 + 420 * op, 880], [540, 900]], 44, 55, 84, { lead: 8 });
          leadLine([[540, 420], [540, 900]], 10);
          if (op > 0.9) {
            leadWord("IRENA", 540 - 210, 660, 96, 44, 92, 50, 105.6, 0.06, { glow: 0.6, a: 1 - out });
            leadWord("SENDLER", 540 + 210, 660, 74, 44, 92, 50, 106.08, 0.05, { glow: 0.6, a: 1 - out });
          }
          ctx.restore();
          alpha(1);
        }
        const hk = eBack(seg(T, 109.52, 110.1));
        if (hk > 0) {
          const beat = 1 + 0.05 * bump(T, 110.48, 0.3) + 0.05 * bump(T, 111.2, 0.3) + 0.03 * Math.sin(T * 5);
          const s = 21 * hk * beat, hx = 540, hy = 820;
          aura(hx, hy, 620, 355, 0.8 * hk);
          const hp = heartPts(hx, hy, s);
          glass(hp, 355, 75, 46, { lead: 12 });
          ctx.save(); pathPts(hp); ctx.clip();
          for (let i = 0; i < 9; i++) { const a = (i / 9) * TAU; leadLine([[hx, hy - 40], [hx + Math.cos(a) * 600, hy - 40 + Math.sin(a) * 600]], 7); }
          glassCircle(hx, hy - 40, 90 * hk, 44, 92, 60, { lead: 7 });
          kid(0, { x: hx - 110, y: hy + 150, s: 0.48 * hk, eyes: "open", smile: true });
          kid(2, { x: hx, y: hy + 170, s: 0.52 * hk, eyes: "open", smile: true });
          kid(4, { x: hx + 110, y: hy + 150, s: 0.48 * hk, eyes: "open", smile: true });
          ctx.restore();
          pathPts(hp); ctx.lineWidth = 6; ctx.strokeStyle = hsl(44, 80, 55); ctx.stroke();
        }
        veil(0.35 * seg(T, 112.4, 114.4) * 0.6);
      });

      // 17 · 115.35–121.6 "Siempre hubo personas capaces de elegir la compasión por encima del miedo."
      scene(115.35, { h: [0, 45, 210, 140, 280], s: 75, l: [16, 30], la: 20, lum: () => 0.6 + 0.6 * eOut(seg(T, 115.4, 117)) }, () => {
        cam(1.04 - 0.04 * seg(T, 115.35, 121.6), 540, 800);
        const JEWEL = [[44, 92, 58], [352, 72, 46], [214, 72, 48], [150, 62, 42], [280, 58, 50], [190, 70, 46]];
        const lit = eOut(seg(T, 115.4, 116.6));
        aura(540, 700, 900, 44, 0.9 * lit + 0.4 * bump(T, 118.79, 1.2));
        rose(540, 700, 500, T * 0.06, (ri, i, n) => {
          const J = JEWEL[(i * 2 + ri) % JEWEL.length];
          const k = seg(T, 115.4 + ri * 0.2 + (i / n) * 0.3, 115.8 + ri * 0.2 + (i / n) * 0.3);
          return [J[0], J[1], J[2], lerp(0.5, 1.12, k), ri === 0 ? 0.9 : 0];
        });
        rays(540, 700, 0.6 * lit + 1.0 * bump(T, 118.79, 1.4), 44, T * 0.12, 12);
        irena({ x: 540, y: 1330, s: 1.45, halo: 1, eyes: "open", smile: true, armF: 0.9, armB: 0.9 });
        [[250, 0], [360, 3], [720, 2], [830, 5]].forEach(([x, i], n) => {
          const k = eOut(seg(T, 116.0 + n * 0.25, 116.6 + n * 0.25));
          kid(i, { x, y: 1330 + (1 - k) * 400, s: 0.62, dir: x < 540 ? 1 : -1, eyes: "open", smile: true, armF: 0.6 });
        });
        motes(60, 44, 3, lit);
      });

      const CUTS = SC.map((s) => s.t0);
      function sceneAt(t) { let k = 0; CUTS.forEach((c, i) => { if (t >= c) k = i; }); return k; }

      // ---------- Capa final: textura de vidrio, viñeta ----------
      const GRAIN = [];
      for (let g = 0; g < 3; g++) {
        const c = document.createElement("canvas");
        c.width = 256; c.height = 256;
        const gx = c.getContext("2d");
        const img = gx.createImageData(256, 256);
        for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
          const i = (y * 256 + x) * 4;
          const ripple = Math.sin(x * 0.11 + Math.sin(y * 0.05 + g) * 3) * Math.sin(y * 0.09 + x * 0.02);
          const v = 128 + ripple * 60 + (hash(x * 1.31 + y * 7.17 + g * 999) - 0.5) * 50;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        gx.putImageData(img, 0, 0);
        GRAIN.push(ctx.createPattern(c, "repeat"));
      }
      function overlays() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "overlay";
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = GRAIN[Math.floor(T * 8) % 3];
        ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        const vg = ctx.createRadialGradient(W / 2, H * 0.42, H * 0.26, W / 2, H * 0.42, H * 0.75);
        vg.addColorStop(0, "rgba(0,0,0,0)");
        vg.addColorStop(1, "rgba(0,0,0,0.62)");
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
      }

      function renderAt(t) {
        T = clamp(t, 0, END);
        const si = sceneAt(T);
        const next = CUTS[si + 1];
        A = next == null ? 1 : 1 - seg(T, next - 0.3, next - 0.02);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#07060c";
        ctx.fillRect(0, 0, W, H);
        drawMosaic();
        veil(0.28);
        ctx.save();
        alpha(1);
        SC[si].draw();
        ctx.restore();
        A = 1;
        overlays();
      }

      // El canvas se dibuja desde el tiempo de la línea de tiempo (determinista)
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);
      renderAt(0);
      if (document.fonts && document.fonts.load) document.fonts.load("900 100px " + SERIF).then(() => renderAt(clock.t));
      window.__timelines["story"] = tl;
    })();
  </script>
</template>
